<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Papan Brainstorming UCD — TaniFresh-Express & TransAgro (Kelompok 4)</title>
  <!-- React, ReactDOM, Babel for single-page standalone canvas -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #0f172a; color: #f8fafc; font-family: 'Inter', sans-serif; overflow: hidden; }
    .canvas-container { cursor: grab; user-select: none; }
    .canvas-container:active { cursor: grabbing; }
    .node-card { transition: box-shadow 0.2s, transform 0.2s; }
    .node-card:hover { transform: translateY(-2px); box-shadow: 0 12px 25px -5px rgba(0, 0, 0, 0.5); }
    .red-string { stroke: #ef4444; stroke-width: 3; stroke-dasharray: 6; animation: dash 30s linear infinite; }
    .green-string { stroke: #22c55e; stroke-dasharray: 4; stroke-width: 2.5; }
    .blue-string { stroke: #3b82f6; stroke-dasharray: 4; stroke-width: 2.5; }
    @keyframes dash { to { stroke-dashoffset: -1000; } }
  </style>
</head>
<body class="w-screen h-screen m-0 p-0 overflow-hidden relative select-none">
  <div id="root" class="w-full h-full"></div>

  <script type="text/babel">
    const { useState } = React;

    const initialNodes = [
      {
        id: 'node-problem-1',
        x: 80,
        y: 120,
        width: 330,
        tag: 'BPS JATIM 2025',
        color: 'border-red-500 bg-red-950/50',
        title: '🔴 Data Masalah 1: Tengkulak & Margin MPP',
        content: `Rantai perantara 4-5 tengkulak di Jatim menyebabkan Margin Perdagangan (MPP) membengkak 42.65% - 58.10%. Petani Pujon hanya dapat Rp 12.000/kg padahal harga pasar Rp 35.000/kg.`,
        pdfLink: 'https://jatim.bps.go.id',
        pdfTitle: '📄 Link BPS Jatim.pdf'
      },
      {
        id: 'node-problem-2',
        x: 80,
        y: 430,
        width: 330,
        tag: 'KEMENTAN RI',
        color: 'border-orange-500 bg-orange-950/50',
        title: '🔴 Data Masalah 2: Pembusukan Sayur (Post-Harvest)',
        content: `Tingkat kerusakan pasca-panen (post-harvest loss) komoditas tomat & cabai mencapai 20% - 35% akibat pengangkutan cold-chain buruk dan transit terlalu lama di rute pegunungan.`,
        pdfLink: 'https://hortikultura.pertanian.go.id',
        pdfTitle: '📄 Laporan Kementan.pdf'
      },
      {
        id: 'node-geo',
        x: 480,
        y: 270,
        width: 340,
        tag: 'BMKG MALANG & GOOGLE MAPS',
        color: 'border-yellow-500 bg-yellow-950/50',
        title: '🗺️ Geografis & Rute Ekstrem Pujon - Malang',
        content: `Rute 38.5 km (Pujon - Karangploso - Pasar Induk Gadang Malang) sering mengalami tebing longsor & genangan air akibat curah hujan ekstrem 120mm/jam.`,
        mapCoords: 'Google Maps: Pujon Malang (-7.8427, 112.4673)',
        mapUrl: 'https://maps.google.com/?q=-7.8427,112.4673'
      },
      {
        id: 'node-persona',
        x: 880,
        y: 120,
        width: 340,
        tag: 'PENGEPUL & KOORDINATOR LOGISTIK',
        color: 'border-emerald-500 bg-emerald-950/50',
        title: '👤 User Persona: Pak Bambang Hariyadi',
        content: `Bambang Hariyadi (45 Th) - Pujon, Malang. Mengordinasi 15+ armada truk. Goals: Kerusakan < 5%, butuh kepastian rute aman hujan & jam berangkat efisien.`,
        image: 'https://images.unsplash.com/photo-1544717305-2782549b5136?auto=format&fit=crop&w=300&q=80'
      },
      {
        id: 'node-solution-1',
        x: 1280,
        y: 100,
        width: 360,
        tag: 'DIRECT MICRO-DISTRIBUTION',
        color: 'border-green-500 bg-green-950/60',
        title: '🌱 Solusi 1: TaniFresh-Express',
        content: `Platform B2C/B2B ritel yang menghubungkan petani lokal Pujon langsung dengan konsumen/restoran kota tanpa tengkulak. Pengiriman terdekat berbasis zona & packaging minim plastik.`,
        badge: 'No Tengkulak • Low Emission'
      },
      {
        id: 'node-solution-2',
        x: 1280,
        y: 430,
        width: 360,
        tag: 'LOGISTICS RISK ENGINE (UTAMA KELOMPOK 4)',
        color: 'border-cyan-500 bg-cyan-950/60',
        title: '🚛 Solusi 2: TransAgro Spoilage-Route',
        content: `Weather Risk Engine berbasis data BMKG yang kalkulasi otomatis kerentanan pembusukan sayur & mengurutkan prioritas jam keberangkatan truk. Efisiensi 10m -> 2m.`,
        badge: 'BMKG Data Integrated • Priority Fleet'
      }
    ];

    const connections = [
      { from: 'node-problem-1', to: 'node-persona', label: 'Monopoli Harga Tengkulak', type: 'red' },
      { from: 'node-problem-2', to: 'node-geo', label: 'Transit Rute Lambat', type: 'red' },
      { from: 'node-geo', to: 'node-persona', label: 'Cuaca Ekstrem Pujon', type: 'red' },
      { from: 'node-persona', to: 'node-solution-1', label: 'Potong Jalur Perantara', type: 'green' },
      { from: 'node-persona', to: 'node-solution-2', label: 'Prioritas Armada & Weather Engine', type: 'blue' }
    ];

    function App() {
      const [nodes, setNodes] = useState(initialNodes);
      const [pan, setPan] = useState({ x: 0, y: 0 });
      const [isDraggingCanvas, setIsDraggingCanvas] = useState(false);
      const [dragStart, setDragStart] = useState({ x: 0, y: 0 });
      const [activeDragNode, setActiveDragNode] = useState(null);
      const [nodeDragOffset, setNodeDragOffset] = useState({ x: 0, y: 0 });

      const handleMouseDownCanvas = (e) => {
        if (e.target.dataset.type === 'canvas') {
          setIsDraggingCanvas(true);
          setDragStart({ x: e.clientX - pan.x, y: e.clientY - pan.y });
        }
      };

      const handleMouseMove = (e) => {
        if (isDraggingCanvas) {
          setPan({ x: e.clientX - dragStart.x, y: e.clientY - dragStart.y });
        } else if (activeDragNode) {
          setNodes(prev => prev.map(node => {
            if (node.id === activeDragNode) {
              return {
                ...node,
                x: e.clientX - pan.x - nodeDragOffset.x,
                y: e.clientY - pan.y - nodeDragOffset.y
              };
            }
            return node;
          }));
        }
      };

      const handleMouseUp = () => {
        setIsDraggingCanvas(false);
        setActiveDragNode(null);
      };

      const handleMouseDownNode = (e, nodeId) => {
        e.stopPropagation();
        setActiveDragNode(nodeId);
        const node = nodes.find(n => n.id === nodeId);
        setNodeDragOffset({
          x: e.clientX - pan.x - node.x,
          y: e.clientY - pan.y - node.y
        });
      };

      const getNodeCenter = (id) => {
        const n = nodes.find(item => item.id === id);
        if (!n) return { x: 0, y: 0 };
        return { x: n.x + n.width / 2, y: n.y + 100 };
      };

      return (
        <div 
          data-type="canvas"
          className="w-full h-full relative overflow-hidden bg-slate-950 canvas-container"
          onMouseDown={handleMouseDownCanvas}
          onMouseMove={handleMouseMove}
          onMouseUp={handleMouseUp}
        >
          {/* Header Panel */}
          <div className="absolute top-4 left-6 z-50 bg-slate-900/90 backdrop-blur border border-slate-800 px-5 py-3 rounded-2xl shadow-2xl flex items-center gap-4">
            <div className="bg-red-500/20 text-red-400 p-2 rounded-xl text-xl font-bold">
              🧵
            </div>
            <div>
              <h1 className="font-bold text-base text-slate-100">Papan Brainstorming & Riset UCD (tldraw Style • Kelompok 4)</h1>
              <p className="text-xs text-slate-400">Peta Hubungan Benang Merah Interaktif: Data Riset BPS/BMKG ➔ Persona ➔ Solusi TaniFresh & TransAgro</p>
            </div>
            <div className="ml-4 flex items-center gap-2 text-xs">
              <span className="px-2.5 py-1 bg-red-950/60 border border-red-500/50 text-red-400 rounded-full font-medium">🔴 Benang Merah (Problem)</span>
              <span className="px-2.5 py-1 bg-green-950/60 border border-green-500/50 text-green-400 rounded-full font-medium">🟢 Solusi B2C</span>
              <span className="px-2.5 py-1 bg-blue-950/60 border border-blue-500/50 text-blue-400 rounded-full font-medium">🔵 Solusi B2B Utama</span>
            </div>
          </div>

          {/* Canvas Viewport */}
          <div 
            style={{ transform: `translate(${pan.x}px, ${pan.y}px)` }}
            className="absolute inset-0 pointer-events-none"
          >
            {/* SVG Connection Lines */}
            <svg className="absolute inset-0 w-[5000px] h-[5000px] pointer-events-none z-10">
              {connections.map((conn, idx) => {
                const start = getNodeCenter(conn.from);
                const end = getNodeCenter(conn.to);
                const midX = (start.x + end.x) / 2;
                const midY = (start.y + end.y) / 2 - 30;

                let stringClass = "red-string";
                if (conn.type === 'green') stringClass = "green-string";
                if (conn.type === 'blue') stringClass = "blue-string";

                return (
                  <g key={idx}>
                    <path 
                      d={`M ${start.x} ${start.y} Q ${midX} ${midY} ${end.x} ${end.y}`} 
                      fill="none" 
                      className={stringClass} 
                    />
                    <rect x={midX - 65} y={midY - 12} width="130" height="24" rx="12" fill="#0f172a" stroke="#334155" strokeWidth="1" />
                    <text x={midX} y={midY + 4} textAnchor="middle" fill="#94a3b8" fontSize="10" fontWeight="bold">
                      {conn.label}
                    </text>
                  </g>
                );
              })}
            </svg>

            {/* Canvas Nodes */}
            {nodes.map((node) => (
              <div
                key={node.id}
                onMouseDown={(e) => handleMouseDownNode(e, node.id)}
                style={{
                  left: `${node.x}px`,
                  top: `${node.y}px`,
                  width: `${node.width}px`
                }}
                className={`absolute pointer-events-auto rounded-2xl border-2 p-5 shadow-2xl backdrop-blur-md node-card cursor-grab active:cursor-grabbing z-20 ${node.color}`}
              >
                <div className="flex items-center justify-between mb-3 border-b border-slate-800 pb-2">
                  <span className="text-xs font-bold uppercase tracking-wider text-slate-400">{node.tag}</span>
                  <span className="w-2 h-2 rounded-full bg-slate-500 animate-pulse"></span>
                </div>

                <h3 className="font-bold text-sm text-slate-100 mb-2 leading-snug">{node.title}</h3>
                <p className="text-xs text-slate-300 leading-relaxed mb-4">{node.content}</p>

                {node.image && (
                  <div className="mb-4 rounded-xl overflow-hidden border border-slate-700/80 shadow-inner">
                    <img src={node.image} alt="Persona" className="w-full h-32 object-cover" />
                  </div>
                )}

                {node.pdfLink && (
                  <a 
                    href={node.pdfLink} 
                    target="_blank" 
                    rel="noreferrer" 
                    onClick={(e) => e.stopPropagation()} 
                    className="inline-flex items-center gap-2 text-xs font-medium text-red-400 bg-red-950/80 border border-red-800/80 px-3 py-1.5 rounded-lg hover:bg-red-900 transition-colors"
                  >
                    <span>{node.pdfTitle}</span>
                    <span>↗</span>
                  </a>
                )}

                {node.mapCoords && (
                  <a 
                    href={node.mapUrl} 
                    target="_blank" 
                    rel="noreferrer" 
                    onClick={(e) => e.stopPropagation()} 
                    className="inline-flex items-center gap-2 text-xs font-medium text-yellow-400 bg-yellow-950/80 border border-yellow-800/80 px-3 py-1.5 rounded-lg hover:bg-yellow-900 transition-colors"
                  >
                    <span>📍 {node.mapCoords}</span>
                    <span>↗</span>
                  </a>
                )}

                {node.badge && (
                  <span className="inline-block text-[11px] font-semibold text-emerald-400 bg-emerald-950/80 border border-emerald-800/80 px-3 py-1 rounded-full">
                    {node.badge}
                  </span>
                )}
              </div>
            ))}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
